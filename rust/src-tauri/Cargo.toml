[package]
name = "melodygap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MelodyGap 曲库补漏 - Subsonic/Navidrome 缺失歌曲检测"
repository = "https://github.com/MaroD1M/melody-gap"
build = "build.rs"

[features]
# 生产构建必须启用：否则 Tauri 会尝试连接 devUrl(localhost:5173)。
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.tauri-winres]
OriginalFilename = "MelodyGap.exe"
InternalName = "MelodyGap"
Comments = "Subsonic / Navidrome 曲库缺失歌曲检测工具"

[lib]
name = "melodygap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
melodygap-core = { path = "../crates/melodygap-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com"] }
windows-future = "0.3"
