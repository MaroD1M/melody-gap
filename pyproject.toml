[tool.ruff]
# 通过 pyproject 固定规则集，避免不同机器上的全局 ruff 配置导致结果不一致
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9: 语法与导入错误；F: pyflakes（未使用导入/变量等）；W: 空白问题
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E501",  # 行宽由人工控制，中文 docstring 不强制断行
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
