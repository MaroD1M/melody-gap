name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Verify WinRT dependency
        run: python -c "import winrt.windows.media.control"

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name MelodyGap --icon icon.ico --add-data "icon.ico;." --collect-submodules winrt --collect-binaries winrt main.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/MelodyGap.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path dist/melodygap.log) { Get-Content dist/melodygap.log -Tail 50 }
            throw "MelodyGap.exe 打包自检失败，退出码 $($process.ExitCode)"
          }

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MelodyGap.exe release/
          Copy-Item config.ini.example release/
          Copy-Item README.md release/
          Copy-Item LICENSE release/
          Compress-Archive -Path release/* -DestinationPath dist/MelodyGap-windows-x64.zip -Force
          $hash = (Get-FileHash dist/MelodyGap.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MelodyGap.exe" | Out-File -Encoding ascii dist/MelodyGap.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MelodyGap-windows-x64
          path: |
            dist/MelodyGap.exe
            dist/MelodyGap.exe.sha256
            dist/MelodyGap-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: MelodyGap ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/MelodyGap.exe
            dist/MelodyGap.exe.sha256
            dist/MelodyGap-windows-x64.zip
