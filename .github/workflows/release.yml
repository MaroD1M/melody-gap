name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Verify WinRT dependency
        run: python -c "import winrt.windows.media.control"

      - name: Build release artifacts
        run: python scripts/build_release.py --skip-tests

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $exe = "dist/MelodyGap.exe"
          $info = (Get-Item $exe).VersionInfo
          $expected = (python -c "from app.constants import APP_VERSION; print(APP_VERSION)").Trim()
          if ($info.ProductName -ne "MelodyGap") { throw "ProductName 缺失" }
          if (-not $info.ProductVersion.StartsWith($expected)) { throw "ProductVersion 不符: $($info.ProductVersion) != $expected" }
          if ($info.CompanyName -ne "MaroD1M") { throw "CompanyName 缺失" }
          Write-Host "版本资源: $($info.ProductName) $($info.ProductVersion) / $($info.CompanyName)"

      - name: Smoke test executable
        shell: pwsh
        run: |
          $targets = @("dist/MelodyGap.exe", "build/pyinstaller/out/onedir/MelodyGap/MelodyGap.exe")
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "缺少构建产物: $target" }
            $process = Start-Process -FilePath $target -ArgumentList "--smoke-test" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              $log = Join-Path (Split-Path $target) "melodygap.log"
              if (Test-Path $log) { Get-Content $log -Tail 50 }
              throw "$target 打包自检失败，退出码 $($process.ExitCode)"
            }
            Write-Host "$target 自检通过"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MelodyGap-windows-x64
          path: |
            dist/MelodyGap.exe
            dist/MelodyGap.exe.sha256
            dist/MelodyGap-windows-x64.zip
            dist/MelodyGap-portable-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: MelodyGap ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/MelodyGap.exe
            dist/MelodyGap.exe.sha256
            dist/MelodyGap-windows-x64.zip
            dist/MelodyGap-portable-windows-x64.zip
            dist/SHA256SUMS.txt
