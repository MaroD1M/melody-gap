name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rust/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend check
        run: pnpm check

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Windows release build
        run: cargo build --release --target x86_64-pc-windows-msvc -p melodygap

      - name: Package portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "target/x86_64-pc-windows-msvc/release"
          $stage = Join-Path (Get-Location) "release/MelodyGap"
          Remove-Item "release" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$target/melodygap.exe" "$stage/MelodyGap.exe"
          if (Test-Path "$target/WebView2Loader.dll") {
            Copy-Item "$target/WebView2Loader.dll" "$stage/WebView2Loader.dll"
          }
          Copy-Item "../config.ini.example" "$stage/config.ini.example"
          Copy-Item "../LICENSE" "$stage/LICENSE"
          Compress-Archive -Path $stage -DestinationPath "release/MelodyGap-portable-windows-x64.zip" -CompressionLevel Optimal
          Push-Location release
          try {
            $exeHash = (Get-FileHash "MelodyGap/MelodyGap.exe" -Algorithm SHA256).Hash.ToLower()
            $zipHash = (Get-FileHash "MelodyGap-portable-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
            [System.IO.File]::WriteAllText(
              (Join-Path (Get-Location) "SHA256SUMS.txt"),
              "$exeHash  MelodyGap/MelodyGap.exe`n$zipHash  MelodyGap-portable-windows-x64.zip`n",
              [System.Text.Encoding]::ASCII
            )
          } finally {
            Pop-Location
          }

      - name: Smoke test portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath "release/MelodyGap/MelodyGap.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "打包自检失败，退出码 $($process.ExitCode)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MelodyGap-windows-x64
          path: |
            rust/release/MelodyGap/MelodyGap.exe
            rust/release/MelodyGap-portable-windows-x64.zip
            rust/release/SHA256SUMS.txt
          if-no-files-found: error
