name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先脱敏，不要粘贴真实服务器地址、用户名、密码、token 或完整日志。
  - type: input
    id: version
    attributes:
      label: MelodyGap 版本
      description: 例如 1.0.0，或源码 commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与播放器
      description: Windows 版本、QQ 音乐 / 网易云音乐版本、Subsonic / Navidrome 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从启动程序开始描述
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志
      description: 只保留与问题相关的片段，务必移除服务器地址、账号、密码与 token
      render: text
